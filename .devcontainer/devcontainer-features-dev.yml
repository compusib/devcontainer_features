services:
  devcontainer-features-dev:
    build:
      # Paths are relative to this fragment's dir (.devcontainer). The image is the javascript-node one, with mise.
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      # relative to this fragment's dir (<project>/.devcontainer); .. is the repo root
      #- ..:/workspaces/devcontainer_features:cached
      - type: volume
        source: combined
        target: /workspace
    networks:
      - stack
      - gateway
