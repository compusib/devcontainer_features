name: "CI - Test Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        features:
          - color
          - hello
          - bashrc
          - argbash
          - claude
          - auth
        baseImage:
          - debian:latest
          - ubuntu:latest
          - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - uses: actions/checkout@v4

      # pgtoken's libraries are not in git: the auth feature's package gets them from this build.
      - name: "Build pgtoken (auth)"
        if: matrix.features == 'auth'
        run: make -C src/auth/pgtoken dist ARCHS=amd64

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        run: devcontainer features test --skip-scenarios -f ${{ matrix.features }} -i ${{ matrix.baseImage }} .

  test-scenarios:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        features:
          - color
          - hello
          - bashrc
          - argbash
          - git-hooks
          - claude
          - auth
    steps:
      - uses: actions/checkout@v4

      # pgtoken's libraries are not in git: the auth feature's package gets them from this build.
      - name: "Build pgtoken (auth)"
        if: matrix.features == 'auth'
        run: make -C src/auth/pgtoken dist ARCHS=amd64

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' scenarios"
        run: devcontainer features test -f ${{ matrix.features }} --skip-autogenerated --skip-duplicated .

  # pgtoken (src/auth/pgtoken) is built for two architectures. On each: both are built, and what is built for the
  # runner's own passes pgtoken's gates and the auth feature's tests.
  test-pgtoken:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: "Build pgtoken for both architectures"
        run: make -C src/auth/pgtoken dist

      # ssh-jwt, as mise.toml pins it: the gates ask it for the public half of the agent's key.
      - uses: jdx/mise-action@v5

      - name: "An ssh agent with a key of this run alone"
        run: |
          ssh-keygen -q -t rsa -b 3072 -N '' -f "$RUNNER_TEMP/key"
          ssh-agent -a "$RUNNER_TEMP/agent" > /dev/null
          SSH_AUTH_SOCK="$RUNNER_TEMP/agent" ssh-add -q "$RUNNER_TEMP/key"
          echo "SSH_AUTH_SOCK=$RUNNER_TEMP/agent" >> "$GITHUB_ENV"

      - name: "pgtoken's gates, against what is released"
        run: PGTOKEN_DIR="$PWD/src/auth/pgtoken/dist/linux_$(dpkg --print-architecture)" bash test/auth/pgtoken/gates.sh

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "The auth feature's tests"
        run: |
          devcontainer features test --skip-scenarios -f auth -i debian:latest .
          devcontainer features test -f auth --skip-autogenerated --skip-duplicated .

  test-global:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing global scenarios"
        run: devcontainer features test --global-scenarios-only .
